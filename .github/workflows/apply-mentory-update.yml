name: Apply Mentory update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mentory-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified update
        shell: bash
        run: |
          printf '%s' '' | base64 -d | tar -xzf -
          corepack enable
          pnpm install --lockfile-only
          rm .github/workflows/apply-mentory-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve auth, CV review and candidate workflow'
          git push
